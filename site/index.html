<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mezzi Corsa</title>
<meta name="theme-color" content="#0b5c6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mezzi Corsa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna da telefono, come un tabellone di fermata; due colonne andata/ritorno su schermi larghi. */
:root {
  --bg: #eef3f3; --panel: #ffffff; --fg: #12282d; --muted: #566c71; --line: #d3dfe0;
  --accent: #0b5c6b; --on-accent: #ffffff;
  --train: #b3261e; --bus: #0a5fa8; --metro: #a35a00; --warn-bg: #fff1d6; --warn-fg: #6b4300; --ok: #17703f; --late: #a34b00;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1a1d; --panel: #15272b; --fg: #e6f0f1; --muted: #9db2b6; --line: #2a4247;
    --accent: #5cc4d6; --on-accent: #06262c;
    --train: #ff8a80; --bus: #7dbcf5; --metro: #f0b264; --warn-bg: #3d2d0c; --warn-fg: #ffdc9c; --ok: #6fd6a0; --late: #ffb066;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--body);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 30px/1 var(--display); margin: 18px 0 2px; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 14px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend, label.f { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 6px; display: block; }
.places { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.places input { position: absolute; opacity: 0; }
.places label { text-align: center; padding: 11px 4px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
.places input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.places input:focus-visible + label, select:focus-visible, input[type=time]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.when { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px; }
select, input[type=time] { width: 100%; height: 46px; font: 500 16px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.notice:empty { display: none; }
.results { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
section.dir { display: grid; gap: 12px; min-width: 0; }
.dir h2 { font: 700 24px/1.1 var(--display); margin: 0; }
.dir .hint { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.group h3 { margin: 0; padding: 9px 12px; font: 700 17px var(--display); letter-spacing: .03em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
.group h3 span { font: 400 13px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.group.treno h3 { color: var(--train); } .group.bus h3 { color: var(--bus); } .group.misto h3 { color: var(--accent); }
.trip { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
.trip:last-of-type { border-bottom: 0; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.times { font: 700 23px/1 var(--display); font-variant-numeric: tabular-nums; }
.times small { font: 500 12px var(--body); color: var(--muted); }
.dur { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.leg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; font-size: 14px; align-items: start; }
.badge { font: 700 14px/20px var(--display); min-width: 34px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; text-align: center; border-radius: 4px; color: var(--panel); }
.badge.m0 { background: var(--train); } .badge.m1 { background: var(--bus); } .badge.m2 { background: var(--metro); }
.leg time { font-weight: 600; font-variant-numeric: tabular-nums; }
.dirn { color: var(--muted); font-size: 13px; display: block; }
.more { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); color: var(--accent); font: 600 14px var(--body); padding: 10px; cursor: pointer; }
.empty { padding: 12px; color: var(--muted); font-size: 14px; margin: 0; }
.live { display: inline-block; font-size: 13px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.live.ok { color: var(--ok); } .live.late, .risk { color: var(--late); } .live.gone { color: var(--train); }
.risk { font-size: 13px; font-weight: 600; }
.livebar { color: var(--muted); font-size: 13px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.tabs button { font: 700 18px var(--display); letter-spacing: .03em; text-transform: uppercase; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ac { position: relative; }
.ac input { width: 100%; height: 46px; font: 500 16px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.ac input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sugg { position: absolute; z-index: 5; left: 0; right: 0; top: 50px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.sugg button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; font: 500 15px var(--body); color: var(--fg); cursor: pointer; }
.sugg button:last-child { border-bottom: 0; }
.sugg button small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.sugg button:hover, .sugg button:focus-visible { background: var(--bg); outline: 0; }
.swap { justify-self: start; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); font: 600 14px var(--body); padding: 6px 12px; cursor: pointer; }
.walk { color: var(--muted); font-size: 13px; }
.check { font-size: 14px; color: var(--accent); font-weight: 600; }
footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mezzi Corsa</h1>
    <p class="sub" id="sub">Da via Menotti al punto di partenza, e ritorno</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-corsa" aria-selected="true">Corsa</button>
      <button type="button" role="tab" id="tab-viaggio" aria-selected="false">Viaggio</button>
    </div>
  </header>

  <form id="form">
    <fieldset>
      <legend>Dove corri</legend>
      <div class="places" id="places"></div>
    </fieldset>
    <div class="when">
      <div><label class="f" for="date">Giorno</label><select id="date"></select></div>
      <div><label class="f" for="time">Essere lì alle</label><input id="time" type="time" value="18:30"></div>
    </div>
  </form>

  <form id="vform" hidden>
    <div>
      <label class="f" for="v-from">Da</label>
      <div class="ac"><input id="v-from" type="text" autocomplete="off" placeholder="La mia posizione"><div class="sugg" id="v-from-list" hidden></div></div>
    </div>
    <button type="button" class="swap" id="v-swap">Inverti partenza e arrivo</button>
    <div>
      <label class="f" for="v-to">A</label>
      <div class="ac"><input id="v-to" type="text" autocomplete="off" placeholder="Via, fermata o luogo"><div class="sugg" id="v-to-list" hidden></div></div>
    </div>
    <div class="when">
      <div><label class="f" for="v-date">Giorno</label><select id="v-date"></select></div>
      <div><label class="f" for="v-time">Parto alle</label><input id="v-time" type="time"></div>
    </div>
  </form>

  <div class="notice" id="notice" role="status"></div>
  <div class="livebar" id="livebar" aria-live="polite"></div>
  <div class="results" id="results"></div>
  <footer id="foot">Caricamento degli orari…</footer>
</main>

<script src="live-config.js"></script>
<script src="router.js"></script>
<script>
const CLASSES = [["treno", "Solo treno"], ["bus", "Solo bus e metro"], ["misto", "Treno + bus"]];
const LIMIT = 5;
const WINDOW_BEFORE = 120;
const $ = (id) => document.getElementById(id);
let index = null;
const dayCache = {};

const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, value);
  } catch { return null; }
}

function dateLabel(iso, today) {
  const d = new Date(iso + "T12:00:00");
  const text = d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
  const diff = Math.round((d - new Date(today + "T12:00:00")) / 86400000);
  return diff === 0 ? `Oggi, ${text}` : diff === 1 ? `Domani, ${text}` : text;
}

function localToday() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
}

async function loadDay(key) {
  if (!dayCache[key]) {
    const r = await fetch(`data/days/${key}.json`);
    if (!r.ok) throw new Error("day");
    dayCache[key] = await r.json();
  }
  return dayCache[key];
}

function legEl(leg, s, tpl) {
  const [mode, line, head, from, to, dep, arr] = leg;
  const el = tpl.cloneNode(true);
  const badge = el.querySelector(".badge");
  badge.textContent = s[line] || (mode === 0 ? "Treno" : "Bus");
  badge.classList.add(`m${mode}`);
  el.querySelector(".from").textContent = s[from];
  el.querySelector(".dep").textContent = hhmm(dep);
  el.querySelector(".to").textContent = s[to];
  el.querySelector(".arr").textContent = hhmm(arr);
  el.querySelector(".dirn").textContent = s[head] ? `direzione ${s[head]}` : "";
  const live = document.createElement("span");
  live.className = "live";
  el.lastElementChild.append(live);
  return { el, live };
}

const LEG = (() => {
  const t = document.createElement("div");
  t.className = "leg";
  t.innerHTML = '<span class="badge"></span><span><span class="from"></span> <time class="dep"></time> → <span class="to"></span> <time class="arr"></time><span class="dirn"></span></span>';
  return t;
})();

function tripEl(j, s, labels) {
  const [leave, arrive, , legs] = j;
  const el = document.createElement("article");
  el.className = "trip";
  const head = document.createElement("div");
  head.className = "head";
  const times = document.createElement("div");
  times.className = "times";
  times.innerHTML = `<small>${labels[0]}</small> ${hhmm(leave)} <small>${labels[1]}</small> ${hhmm(arrive)}`;
  const dur = document.createElement("div");
  dur.className = "dur";
  const changes = legs.length - 1;
  dur.textContent = `${arrive - leave} min${changes ? ` · ${changes} ${changes === 1 ? "cambio" : "cambi"}` : ""}`;
  head.append(times, dur);
  el.append(head);
  const note = (text) => { const d = document.createElement("div"); d.className = "walk"; d.textContent = text; el.append(d); };
  const walkOut = arrive - legs[legs.length - 1][6];
  if (j[4]?.in) note(j[4].in);
  else if (j[2] > 0) note(`${j[2]} min a piedi fino a ${s[legs[0][3]]}`);
  const parts = legs.map((l) => ({ leg: l, ...legEl(l, s, LEG) }));
  parts.forEach((p) => el.append(p.el));
  if (j[4]?.out) note(j[4].out);
  else if (!j[4] && walkOut > 0) note(`poi ${walkOut} min a piedi`);
  const risk = document.createElement("div");
  risk.className = "risk";
  el.append(risk);
  liveTrips.push({ parts, risk, s });
  return el;
}

function groupEl(cls, title, items, s, labels) {
  const box = document.createElement("div");
  box.className = `group ${cls}`;
  const h = document.createElement("h3");
  h.textContent = title;
  const n = document.createElement("span");
  n.textContent = items.length === 1 ? "1 soluzione" : `${items.length} soluzioni`;
  h.append(n);
  box.append(h);
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nessuna soluzione in questa fascia.";
    box.append(p);
    return box;
  }
  items.slice(0, LIMIT).forEach((j) => box.append(tripEl(j, s, labels)));
  if (items.length > LIMIT) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "more";
    more.textContent = `Mostra altre ${items.length - LIMIT}`;
    more.onclick = () => {
      more.remove();
      items.slice(LIMIT).forEach((j) => box.append(tripEl(j, s, labels)));
      refreshLive();
    };
    box.append(more);
  }
  return box;
}

function mapsLink(a, b) {
  const q = new URLSearchParams({ api: "1", origin: a, destination: b, travelmode: "transit" });
  const link = document.createElement("a");
  link.className = "check";
  link.href = `https://www.google.com/maps/dir/?${q}`;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = "Apri in Google Maps";
  return link;
}

function sectionEl(title, hint, groups, a, b) {
  const sec = document.createElement("section");
  sec.className = "dir";
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.textContent = title;
  const p = document.createElement("p");
  p.className = "hint";
  p.textContent = hint;
  wrap.append(h, p);
  sec.append(wrap, ...groups, mapsLink(a, b));
  return sec;
}

function render() {
  if (!index) return;
  return tab === "viaggio" ? renderViaggio() : renderCorsa();
}

async function renderCorsa() {
  const place = document.querySelector("input[name=place]:checked").value;
  const date = $("date").value;
  const target = toMin($("time").value || "18:30");
  store("place", place);
  store("time", $("time").value);
  const info = index.dates[date];
  const P = index.places;

  const warn = [];
  if (!info.trains) warn.push("Per questo giorno non sono ancora pubblicati gli orari dei treni: trovi solo i bus.");
  if (!info.buses) warn.push("Per questo giorno non sono ancora pubblicati gli orari AMT: trovi solo i treni.");
  $("notice").textContent = warn.join(" ");

  let day;
  try {
    day = await loadDay(info.day);
  } catch {
    $("notice").textContent = "Non riesco a caricare gli orari. Controlla la connessione e riprova.";
    return;
  }
  const out = day.od[`casa>${place}`] || {};
  const back = day.od[`${place}>casa`] || {};
  const name = P[place].name;

  liveTrips = [];
  liveDate = date;
  const notBefore = date === localToday() ? nowMin() : 0;
  const outward = CLASSES.map(([c, t]) => {
    const items = (out[c] || []).filter((j) => j[1] <= target && j[1] > target - WINDOW_BEFORE && j[0] >= notBefore)
      .sort((x, y) => y[1] - x[1] || y[0] - x[0]);
    return groupEl(c, t, items, day.s, ["esci", "arrivi"]);
  });
  const home = CLASSES.map(([c, t]) => {
    const items = (back[c] || []).filter((j) => j[0] >= target + 60 && j[0] <= target + 240 && j[0] >= notBefore)
      .sort((x, y) => x[0] - y[0] || x[1] - y[1]);
    return groupEl(c, t, items, day.s, ["parti", "a casa"]);
  });

  $("results").replaceChildren(
    sectionEl(`Andata a ${name}`, `Per arrivare entro le ${hhmm(target)}. Le prime sono quelle che ti fanno uscire più tardi.${notBefore ? " Le partenze già passate non sono mostrate." : ""}`, outward, P.casa.maps, P[place].maps),
    sectionEl("Ritorno a casa", `Partenze da ${name} tra le ${hhmm(target + 60)} e le ${hhmm(target + 240)}.`, home, P[place].maps, P.casa.maps));
  refreshLive();
}

const LIVE_BEFORE = 10;
const LIVE_AHEAD = 120;
const REFRESH_MS = 30000;
let liveTrips = [];
let liveDate = "";
let liveData = { bus: {}, train: {} };

const norm = (l) => String(l).replace(/^0+(?=.)/, "").toUpperCase();
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };

function trackable() {
  if (liveDate !== localToday()) return [];
  const now = nowMin();
  return liveTrips.flatMap((t) => t.parts).filter((p) => p.leg[5] >= now - LIVE_BEFORE && p.leg[5] <= now + LIVE_AHEAD);
}

function liveFor(part, s) {
  const [mode, line, , from, , dep] = part.leg;
  if (mode === 0) {
    const number = (s[line].match(/\d+/g) || []).pop();
    const row = (liveData.train[s[from]] || []).find((t) => t.number === number);
    if (!row) return null;
    return { delay: row.delay, cancelled: row.cancelled, platform: row.platform, label: "" };
  }
  const rows = (liveData.bus[part.leg[7]] || []).filter((r) => norm(r.line) === norm(s[line]));
  let best = null;
  rows.forEach((r) => {
    const delay = toMin(r.time) - dep;
    if (Math.abs(delay) <= 20 && (!best || Math.abs(delay) < Math.abs(best.delay))) best = { delay, time: r.time };
  });
  return best;
}

function paintLive() {
  liveTrips.forEach(({ parts, risk, s }) => {
    let riskText = "";
    parts.forEach((p, i) => {
      p.liveInfo = liveFor(p, s);
      const info = p.liveInfo;
      if (!info) { p.live.textContent = ""; p.live.className = "live"; return; }
      const platform = info.platform ? ` · binario ${info.platform}` : "";
      if (info.cancelled) {
        p.live.textContent = "Cancellato";
        p.live.className = "live gone";
      } else {
        const at = hhmm(p.leg[5] + info.delay);
        const late = info.delay >= 2;
        const early = info.delay <= -2;
        const wait = p.leg[5] + info.delay - nowMin();
        const soon = liveDate !== localToday() || wait < 0 || wait > 59 ? "" : wait === 0 ? " · in arrivo" : ` · tra ${wait} min`;
        p.live.textContent = (late ? `${info.delay} min di ritardo, passa alle ${at}`
          : early ? `In anticipo, passa alle ${at}` : "In orario") + soon + platform;
        p.live.className = `live ${late || early ? "late" : "ok"}`;
      }
      const prev = parts[i - 1];
      if (prev?.liveInfo && !prev.liveInfo.cancelled) {
        const reach = prev.leg[6] + prev.liveInfo.delay;
        const leaves = p.leg[5] + (info.cancelled ? 0 : info.delay);
        if (reach >= leaves) riskText = "Coincidenza a rischio";
      }
    });
    risk.textContent = riskText;
  });
}

async function refreshLive() {
  const bar = $("livebar");
  if (!window.LIVE_URL) { bar.textContent = ""; return; }
  const parts = trackable();
  if (!parts.length) {
    bar.textContent = liveDate === localToday() ? "Nessuna partenza nelle prossime 2 ore da seguire in tempo reale." : "Il tempo reale è disponibile solo per oggi.";
    paintLive();
    return;
  }
  parts.sort((a, b) => a.leg[5] - b.leg[5]);
  const byMode = (f) => [...new Set(parts.map(f).filter(Boolean))];
  const stringsOf = new Map(liveTrips.flatMap((t) => t.parts.map((p) => [p, t.s])));
  const bus = byMode((p) => (p.leg[0] === 0 ? null : p.leg[7])).slice(0, 20);
  const train = byMode((p) => (p.leg[0] === 0 ? stringsOf.get(p)[p.leg[3]] : null)).slice(0, 6);
  try {
    const q = new URLSearchParams({ bus: bus.join(","), train: train.join("|") });
    const r = await fetch(`${window.LIVE_URL}/live?${q}`);
    if (!r.ok) throw new Error("live");
    const data = await r.json();
    liveData = { bus: data.bus || {}, train: data.train || {} };
    paintLive();
    const busDown = Object.values(liveData.bus).some((v) => v === null);
    const trainDown = Object.values(liveData.train).some((v) => v === null);
    const at = new Date(data.at).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    bar.textContent = `Tempo reale aggiornato alle ${at}${busDown ? ". Alcune fermate bus non hanno risposto" : ""}${trainDown ? ". Ritardi dei treni non disponibili" : ""}. Dove non c'è l'indicazione vale l'orario programmato.`;
  } catch {
    bar.textContent = "Tempo reale non disponibile: stai vedendo gli orari programmati.";
  }
}

// ---------- Scheda Viaggio ----------
const AREA = [8.70, 44.36, 9.12, 44.56]; // lon/lat min, lon/lat max: stessa area degli orari
const SEARCH_WINDOW = 120;
const netCache = {};
let tab = "corsa";
let vFrom = null; // null = posizione attuale
let vTo = null;
let vTimeTouched = false;
let vRun = 0;
let lastFix = null;

async function loadNet(key) {
  if (!netCache[key]) {
    const r = await fetch(`data/net/${key}.json`);
    if (!r.ok) throw new Error("net");
    netCache[key] = Router.prepare(await r.json());
  }
  return netCache[key];
}

function position() {
  if (lastFix && Date.now() - lastFix.at < 60000) return Promise.resolve(lastFix);
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("geo")); return; }
    navigator.geolocation.getCurrentPosition((p) => {
      lastFix = { lat: p.coords.latitude, lon: p.coords.longitude, label: "La mia posizione", at: Date.now() };
      resolve(lastFix);
    }, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}

const plainText = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function recentPlaces() {
  try { return JSON.parse(store("recent") || "[]").filter((r) => r && r.label && Number.isFinite(r.lat) && Number.isFinite(r.lon)); } catch { return []; }
}

function remember(item) {
  if (savedPlaces().some((p) => p.label === item.label)) return;
  const list = [{ label: item.label, sub: item.sub || "", lat: item.lat, lon: item.lon }]
    .concat(recentPlaces().filter((r) => r.label !== item.label)).slice(0, 5);
  store("recent", JSON.stringify(list));
}

function savedPlaces() {
  return Object.values(index.places).map((p) => ({ label: p.name, sub: "Luogo salvato", lat: p.pos[0], lon: p.pos[1] }));
}

function stopMatches(net, query) {
  const q = plainText(query), groups = new Map();
  net.stops.forEach((st) => {
    const name = plainText(st.name);
    if (!name.includes(q)) return;
    const gkey = `${name}|${st.rail}`;
    const cur = groups.get(gkey) || { label: st.name, sub: st.rail ? "Stazione" : "Fermata", lat: 0, lon: 0, n: 0, first: name.startsWith(q) };
    cur.lat += st.lat; cur.lon += st.lon; cur.n++;
    groups.set(gkey, cur);
  });
  return [...groups.values()].map((x) => ({ ...x, lat: x.lat / x.n, lon: x.lon / x.n }))
    .sort((a, b) => (b.sub === "Stazione") - (a.sub === "Stazione") || b.first - a.first || a.label.length - b.label.length).slice(0, 4);
}

async function addressMatches(query, signal) {
  const q = new URLSearchParams({ q: query, limit: "6", bbox: AREA.join(","), lat: "44.41", lon: "8.93" });
  const r = await fetch(`https://photon.komoot.io/api/?${q}`, { signal });
  if (!r.ok) throw new Error("geocoder");
  const seen = new Set();
  return (await r.json()).features.map((f) => {
    const p = f.properties, [lon, lat] = f.geometry.coordinates;
    const street = [p.street, p.housenumber].filter(Boolean).join(" ");
    const label = p.name || street;
    const sub = [p.name && street, p.district || p.locality, p.city].filter(Boolean).join(", ");
    return { label, sub, lat, lon };
  }).filter((x) => x.label && x.lon >= AREA[0] && x.lon <= AREA[2] && x.lat >= AREA[1] && x.lat <= AREA[3]
    && !seen.has(`${x.label}|${x.sub}`) && seen.add(`${x.label}|${x.sub}`)).slice(0, 5);
}

function setupField(input, list, isFrom) {
  let timer = 0, abort = null;
  const pick = (item) => {
    if (isFrom) vFrom = item; else vTo = item;
    if (item) remember(item);
    input.value = item ? item.label : "";
    list.hidden = true;
    render();
  };
  const show = (items) => {
    list.replaceChildren(...items.map((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = item.label;
      if (item.sub) { const s = document.createElement("small"); s.textContent = item.sub; b.append(s); }
      b.addEventListener("pointerdown", (e) => e.preventDefault());
      b.addEventListener("click", () => pick(item.here ? null : item));
      return b;
    }));
    list.hidden = !items.length;
  };
  const defaults = () => (isFrom ? [{ label: "La mia posizione", sub: "Usa il GPS del telefono", here: true }] : []).concat(savedPlaces(), recentPlaces().map((r) => ({ ...r, sub: r.sub ? `Recente · ${r.sub}` : "Recente" })));
  const update = () => {
    const query = input.value.trim();
    clearTimeout(timer);
    abort?.abort();
    if (query.length < 2) { show(defaults()); return; }
    const info = index.dates[$("v-date").value];
    const local = netCache[info?.net] ? stopMatches(netCache[info.net], query) : [];
    const saved = savedPlaces().filter((p) => plainText(p.label).includes(plainText(query)));
    show(saved.concat(local));
    if (query.length < 3) return;
    timer = setTimeout(async () => {
      abort = new AbortController();
      try {
        const found = await addressMatches(query, abort.signal);
        if (input.value.trim() === query) show(saved.concat(local, found));
      } catch { /* senza rete o servizio fermo: restano fermate e luoghi salvati */ }
    }, 350);
  };
  input.addEventListener("input", () => { if (isFrom) vFrom = undefined; else vTo = null; update(); });
  input.addEventListener("focus", () => { input.select(); update(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") list.hidden = true; });
  input.addEventListener("blur", () => setTimeout(() => {
    list.hidden = true;
    if (isFrom && vFrom === undefined) { vFrom = null; input.value = ""; render(); }
    if (!isFrom && !vTo && input.value) { input.value = ""; render(); }
  }, 150));
  return pick;
}

function message(text) {
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = text;
  $("results").replaceChildren(p);
}

async function renderViaggio() {
  const run = ++vRun;
  liveTrips = [];
  $("livebar").textContent = "";
  $("notice").textContent = "";
  if (!vTimeTouched) $("v-time").value = hhmm(nowMin());
  const date = $("v-date").value, info = index.dates[date];
  liveDate = date;
  if (!vTo) { message("Scegli la destinazione per vedere i mezzi disponibili."); return; }
  if (!info.net) { message("Per questo giorno la rete non è ancora disponibile. Riprova dopo il prossimo aggiornamento."); return; }
  message("Calcolo dei percorsi…");

  let from, net;
  try {
    from = vFrom || await position();
  } catch {
    if (run !== vRun) return;
    $("notice").textContent = "Non riesco a leggere la tua posizione. Consenti l'accesso alla posizione nel browser oppure scrivi il punto di partenza.";
    message("Manca il punto di partenza.");
    return;
  }
  try {
    net = await loadNet(info.net);
  } catch {
    if (run !== vRun) return;
    $("notice").textContent = "Non riesco a caricare gli orari. Controlla la connessione e riprova.";
    message("");
    return;
  }
  if (run !== vRun) return;
  await new Promise((r) => setTimeout(r, 0));

  const depart = toMin($("v-time").value || hhmm(nowMin()));
  const direct = Router.meters(from.lat, from.lon, vTo.lat, vTo.lon);
  const outside = (p) => p.lon < AREA[0] || p.lon > AREA[2] || p.lat < AREA[1] || p.lat > AREA[3];
  const warn = [];
  if (outside(from)) warn.push("Il punto di partenza è fuori dall'area coperta (Genova).");
  if (outside(vTo)) warn.push("La destinazione è fuori dall'area coperta (Genova).");
  if (!info.trains) warn.push("Per questo giorno non sono ancora pubblicati gli orari dei treni.");
  if (!info.buses) warn.push("Per questo giorno non sono ancora pubblicati gli orari AMT.");
  $("notice").textContent = warn.join(" ");

  const found = Router.plan(net, from, vTo, depart, SEARCH_WINDOW);
  if (run !== vRun) return;
  const s = [];
  const add = (v) => s.push(v) - 1;
  const item = (j, n = net, shift = 0) => [j.leave - shift, j.arrive - shift, j.walkIn, j.legs.map((l) => [l.mode, add(l.line), add(l.head), add(n.stops[l.from].name), add(n.stops[l.to].name), l.dep - shift, l.arr - shift, n.stops[l.from].code]), {
    in: `${j.walkIn} min a piedi fino a ${n.stops[j.legs[0].from].name}`,
    out: `poi ${j.walkOut} min a piedi`,
  }];
  const lists = Object.fromEntries(CLASSES.map(([c]) => [c, found[c].map((j) => item(j))]));
  // Dopo mezzanotte le ultime corse appartengono agli orari del giorno prima.
  if (depart < 240) {
    const d = new Date(`${date}T12:00:00`);
    d.setDate(d.getDate() - 1);
    const prev = index.dates[`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`];
    if (prev?.net) {
      try {
        const night = await loadNet(prev.net);
        if (run !== vRun) return;
        const late = Router.plan(night, from, vTo, depart + 1440, SEARCH_WINDOW);
        CLASSES.forEach(([c]) => {
          const seen = new Set(lists[c].map((j) => `${j[0]}|${j[1]}`));
          late[c].map((j) => item(j, night, 1440)).forEach((j) => { if (!seen.has(`${j[0]}|${j[1]}`)) lists[c].push(j); });
          lists[c].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        });
      } catch { /* senza gli orari di ieri restano quelli di oggi */ }
    }
  }
  liveTrips = [];
  const groups = CLASSES.map(([c, t]) => groupEl(c, t, lists[c], s, ["parti", "arrivi"]));
  const walk = Router.walkMin(direct);
  const hint = `Partenze tra le ${hhmm(depart)} e le ${hhmm(depart + SEARCH_WINDOW)}.` + (walk <= 40 ? ` A piedi sono circa ${walk} minuti.` : "");
  const coord = (p) => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`;
  $("results").replaceChildren(sectionEl(`${vFrom ? `Da ${from.label}` : "Dalla tua posizione"} a ${vTo.label}`, hint, groups, coord(from), coord(vTo)));
  refreshLive();
}

function showTab(name) {
  tab = name === "viaggio" ? "viaggio" : "corsa";
  $("form").hidden = tab !== "corsa";
  $("vform").hidden = tab !== "viaggio";
  $("tab-corsa").setAttribute("aria-selected", String(tab === "corsa"));
  $("tab-viaggio").setAttribute("aria-selected", String(tab === "viaggio"));
  $("sub").textContent = tab === "corsa" ? "Da via Menotti al punto di partenza, e ritorno" : "Da dove sei a dove vuoi, con i mezzi di Genova";
  try { history.replaceState(null, "", tab === "viaggio" ? "#viaggio" : location.pathname + location.search); } catch { /* anteprime senza cronologia */ }
  if (tab === "viaggio" && index) {
    const info = index.dates[$("v-date").value];
    if (info?.net) loadNet(info.net).catch(() => {});
  }
  render();
}

async function init() {
  try {
    const r = await fetch("data/index.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("index");
    index = await r.json();
  } catch {
    $("foot").textContent = "";
    $("notice").textContent = "Orari non disponibili al momento. Riprova tra poco.";
    return;
  }
  const saved = store("place");
  const keys = Object.keys(index.places).filter((k) => k !== "casa");
  $("places").replaceChildren(...keys.flatMap((k) => {
    const input = document.createElement("input");
    input.type = "radio"; input.name = "place"; input.id = `p-${k}`; input.value = k;
    input.checked = saved ? saved === k : k === keys[0];
    const label = document.createElement("label");
    label.htmlFor = input.id;
    label.textContent = index.places[k].name.replace("Piazzale ", "");
    return [input, label];
  }));
  if (!document.querySelector("input[name=place]:checked")) document.querySelector("input[name=place]").checked = true;

  const today = localToday();
  const dates = Object.keys(index.dates).filter((d) => d >= today);
  if (!dates.length) {
    $("foot").textContent = "";
    $("notice").textContent = "Gli orari caricati sono scaduti. Il prossimo aggiornamento automatico li rinnoverà.";
    return;
  }
  $("date").replaceChildren(...dates.map((d) => new Option(dateLabel(d, today), d)));
  $("v-date").replaceChildren(...dates.map((d) => new Option(dateLabel(d, today), d)));
  const savedTime = store("time");
  if (savedTime) $("time").value = savedTime;

  const when = new Date(index.generated).toLocaleDateString("it-IT", { day: "numeric", month: "long" });
  $("foot").textContent = `Orari ufficiali AMT e Trenitalia, aggiornati il ${when}. Per le prossime 2 ore di oggi, ritardi e passaggi previsti arrivano da AMT e ViaggiaTreno. Tratti a piedi stimati a passo tranquillo.`;

  $("form").addEventListener("change", render);
  $("time").addEventListener("input", render);
  $("form").addEventListener("submit", (e) => e.preventDefault());
  $("vform").addEventListener("submit", (e) => e.preventDefault());
  const pickFrom = setupField($("v-from"), $("v-from-list"), true);
  const pickTo = setupField($("v-to"), $("v-to-list"), false);
  $("v-date").addEventListener("change", render);
  $("v-time").addEventListener("input", () => { vTimeTouched = true; render(); });
  $("v-swap").addEventListener("click", async () => {
    const a = vFrom, b = vTo;
    let here = null;
    if (!a && b) { try { here = await position(); } catch { here = null; } }
    vFrom = b; $("v-from").value = b ? b.label : "";
    vTo = a || here; $("v-to").value = vTo ? vTo.label : "";
    render();
  });
  $("tab-corsa").addEventListener("click", () => showTab("corsa"));
  $("tab-viaggio").addEventListener("click", () => showTab("viaggio"));
  showTab(location.hash === "#viaggio" ? "viaggio" : "corsa");
  setInterval(() => { if (!document.hidden) refreshLive(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshLive(); });
}
init();
</script>
