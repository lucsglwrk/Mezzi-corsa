name: Aggiorna orari e sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # ogni lunedi
    - cron: "17 3 * * 4"   # ogni giovedi

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test del calcolo
        run: |
          python -m unittest discover -s tests -v
          node --test tests/worker.test.mjs
      - name: Scarica gli orari e calcola i percorsi
        run: python scripts/build_data.py --out site/data --report report.txt
      - name: Prova il ponte live
        continue-on-error: true
        run: |
          echo "" >> report.txt
          echo "# Prova ponte live" >> report.txt
          curl -sS -m 40 -G "https://mezzi-corsa.luca-saglia-work.workers.dev/live" \
            --data-urlencode "bus=0075" \
            --data-urlencode "train=GENOVA SESTRI PONENTE|GENOVA BRIGNOLE" | head -c 3000 >> report.txt
          echo "" >> report.txt
      - name: Prova diretta ViaggiaTreno
        continue-on-error: true
        run: |
          VT=www.viaggiatreno.it/infomobilita/resteasy/viaggiatreno
          echo "# Prova ViaggiaTreno" >> report.txt
          for u in "http://$VT/autocompletaStazione/GENOVA%20SESTRI" "https://$VT/autocompletaStazione/GENOVA%20SESTRI" "https://www.viaggiatreno.it/infomobilitamobile/resteasy/viaggiatreno/autocompletaStazione/GENOVA%20SESTRI"; do
            echo "URL $u" >> report.txt
            curl -sS -m 20 -A "Mozilla/5.0" -L -w "\nHTTP %{http_code} finale %{url_effective}\n" "$u" 2>&1 | head -c 500 >> report.txt
            echo "" >> report.txt
          done
          D=$(TZ=Europe/Rome LC_ALL=C date "+%a %b %d %Y %H:%M:%S GMT%z" | sed 's/ /%20/g; s/+/%2B/')
          CODE=$(curl -sS -m 20 -A "Mozilla/5.0" -L "https://$VT/autocompletaStazione/GENOVA%20SESTRI%20PONENTE" | head -1 | tr -d '\r' | cut -d'|' -f2)
          echo "CODICE $CODE" >> report.txt
          curl -sS -m 20 -A "Mozilla/5.0" -L -w "\nHTTP %{http_code}\n" "https://$VT/partenze/$CODE/$D" 2>&1 | head -c 1200 >> report.txt
          echo "" >> report.txt
      - name: Salva il rapporto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.txt
          git diff --cached --quiet || git commit -m "Aggiorna rapporto dati [skip ci]"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
